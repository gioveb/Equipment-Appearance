; Equipment Appearance 0.2.1
; Close Dragon Age: Origins before editing this file. Restart to apply changes.
; Use 1 to enable an option, 0 to disable it. Each [Enabled] belongs to its section.
; Install beside equipment_appearance.dll, not in the Documents override.

[General]
; Master switch for the entire Equipment Appearance plugin.
; 0 disables all features below, including the quickbar eye button.
Enabled=1

[FullBody]
; Extend full-body robe rendering to supported rob-type armour variations.
; Separate gloves and boots remain equipped and keep their stats, but their
; models are hidden when the torso provides the complete outfit.
; Applies to eligible armour BaseItems 9, 10, 11 and 12; does not change the mesh.
; The included Templar compatibility fix preserves its separate glove models.
Enabled=1

[Heels]
; Read the HEELS FLOAT variable from supported equipped boots / rob-type torso.
; The value is the visual lift in centimetres (for example 5.1 = 5.1 cm).
; Requires an item authored with HEELS and suitable heel geometry.
; Does not add heels to meshes or move the character's gameplay position.
Enabled=1

[Camera]
; Compensate supported dialogue camera shots for the visual HEELS height.
; 0 leaves dialogue cameras at their native positions; heel lift still applies.
; Unsupported or ambiguous shots may retain native camera positioning.
DialogueCompensation=1

[Preview]
; Apply HEELS lift in the inventory character preview.
; Recommended: 0. The preview has no ground reference and lifting may cause
; small jumps when switching characters. Does not disable lift in party selection.
InventoryLift=0

[HelmetDiagnostics]
; Extra helmet/model diagnostic messages in equipment_appearance.log.
; Recommended: 0 for normal play; use 1 when reporting a helmet problem.
; This does not turn off the plugin's normal startup and action messages.
Enabled=0

[Helmets]
; Show equipped helmets during supported dialogues when visible for that actor.
; A helmet hidden with the eye button stays hidden, regardless of this option.
; 0 keeps native dialogue helmet removal for otherwise visible helmets.
; Inventory preview continues to show the equipped helmet.
ShowInDialogues=1

; Apply each character's helmet visibility choice in companion selection.
; 1 = follow the per-character eye-button choice; 0 = native DAO helmet behaviour
; in that room. This setting does not affect HEELS in companion selection.
PartyPickerVisibility=1

; Save the eye-button choice as the character-local INT EA_HIDE_HELMET.
; 0 = visible, 1 = hidden. Save the game to store the current choice.
; This variable belongs to the character, not the equipped helmet UTI.
; 0 below uses temporary session-only choices instead of saved preferences.
SaveCharacterPreference=1

[WeaponScaling]
; Independent switches. BOTH OFF = original weapon size (diagnostics may remain active).
; Applies a uniform visual scale to each recognized weapon instance.
; The weapon local origin and world attachment position are preserved.
TableEnabled=1
CreatureEnabled=0
; 1 = known vanilla darkspawn weapon/shield/quiver models ignore creature scale.
; Their table factor still applies. Works even with TableEnabled=0.
; Applies to the weapon model, regardless of its wielder. 0 restores normal rules.
; Replacements with the same model names are recognized; renamed custom models are not.
ExcludeDarkspawnFromCreatureScale=1
; JSON beside the plugin DLL; exact mesh names and reference SHA-256.
TableFile=dalls_weapon_scales.json
; Default table-side factor for a resolved mesh not listed, or with an unknown hash.
; Used only when TableEnabled=1. 1.0 preserves its installed mesh size.
; Explicitly disabled entries and unresolved mesh names are not affected.
; Creature scale still multiplies this value, except for exempt darkspawn models.
; Allowed range: 0.05 to 10. Restart DAO after changing options.
UnknownWeaponScale=1.0
; 1 enables load/attachment/node diagnostics even with both scaling factors OFF.
Diagnostics=1

[WeaponCreatureScale]
; Extra uniform factors. Used independently of table membership/hash.
; 1.0 = unchanged; 0.8 = 80 percent. Allowed finite range: 0.05 to 10.
; Q is the native appearance-table race code for qunari; unknown codes use 1.0.
HF=1.0
HM=1.0
EF=1.0
EM=1.0
DF=1.0
DM=1.0
QF=1.0
QM=1.0
